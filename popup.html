<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <header class="head">
      <div class="logo" aria-hidden="true"></div>
      <div>
        <h1>Focus Lock</h1>
        <p class="muted tagline">Box up the distractions.</p>
      </div>
    </header>

    <section class="card">
      <h2>Start a focus session</h2>
      <p class="muted hint">Add sites to lock, then choose how long.</p>

      <div id="presetRow" class="preset-row"></div>
      <div id="chips" class="chips"></div>
      <input id="siteInput" type="text" autocomplete="off"
             placeholder="e.g. youtube.com — press Enter" />

      <div class="duration">
        <div class="duration-row" id="presets">
          <button class="chip-btn" data-min="30">30m</button>
          <button class="chip-btn" data-min="60">1h</button>
          <button class="chip-btn" data-min="120">2h</button>
          <button class="chip-btn" data-min="240">4h</button>
          <button class="chip-btn" data-min="420">7h</button>
        </div>
        <div class="custom-row">
          <label class="muted" for="customHours">Custom</label>
          <input id="customHours" type="number" min="0" max="48" step="0.5" placeholder="hrs" />
        </div>
      </div>

      <button id="startBtn" class="btn-primary block" disabled>Lock for —</button>
    </section>

    <section class="card" id="activeCard" hidden>
      <h2>Locked right now</h2>
      <ul id="activeList" class="active-list"></ul>
    </section>

    <footer class="foot">
      <a href="#" id="openOptions">Schedules, stats &amp; settings →</a>
      <a href="https://ko-fi.com/toscame" target="_blank" rel="noopener" class="support-link">☕ Support Focus Lock</a>
    </footer>
  </div>

  <!-- Hardened-mode commitment modal -->
  <div id="commitModal" class="modal" hidden>
    <div class="modal-card">
      <h3 id="commitTitle">Are you sure?</h3>
      <p class="muted commit-why" id="commitWhy"></p>
      <p class="commit-phrase" id="commitPhrase"></p>
      <input id="commitInput" type="text" autocomplete="off" placeholder="type the phrase exactly" />
      <div class="modal-actions">
        <button id="commitCancel" class="btn-primary">Keep me focused</button>
        <button id="commitOk" class="btn-ghost danger-link" disabled>Confirm</button>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
